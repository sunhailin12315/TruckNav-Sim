name: CI

on:
    push:
        branches:
            - master
            - dev
    pull_request:

jobs:
    # ---------------------------------------------------------
    # TESTS & TYPECHECK
    # ---------------------------------------------------------
    quality:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"

            - name: Install Dependencies
              run: npm ci

            - name: Unit Tests
              run: npm run test

            - name: Typecheck
              run: npm run typecheck
